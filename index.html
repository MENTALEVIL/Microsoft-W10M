<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>arch-chat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0d0e15;
            color: #c0caf5;
            font-family: monospace;
            font-size: 14px;
            padding: 10px;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .terminal {
            background-color: #12131a;
            border: 1px solid #232433;
            border-radius: 8px;
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .header {
            background: rgba(0,0,0,0.3);
            padding: 8px 12px;
            border-bottom: 1px solid #232433;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #565f89;
        }
        .header-title { color: #7dcfff; }
        .sys-info {
            padding: 12px;
            border-bottom: 1px dashed #232433;
            color: #565f89;
            font-size: 13px;
        }
        .sys-info span { color: #c0caf5; }
        .color-boxes { display: flex; gap: 4px; margin-top: 8px; }
        .box { width: 14px; height: 14px; border-radius: 2px; }
        .chat-area {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .msg { word-break: break-word; white-space: pre-wrap; margin-bottom: 5px; }
        .prompt-line { color: #bb9af7; font-weight: bold; margin-bottom: 2px; }
        .user-msg .prompt-line { color: #34d67f; }
        .ai-msg .prompt-line { color: #7dcfff; }
        .err-msg { color: #f7768e; }
        .input-container {
            padding: 10px;
            background: rgba(0,0,0,0.2);
            border-top: 1px solid #232433;
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .input-prefix { color: #34d67f; font-weight: bold; white-space: nowrap; }
        input {
            flex: 1;
            background: transparent;
            border: none;
            color: #c0caf5;
            font-family: monospace;
            font-size: 14px;
            outline: none;
        }
        button {
            background: #232433;
            border: 1px solid #232433;
            color: #7dcfff;
            padding: 6px 12px;
            font-family: monospace;
            border-radius: 4px;
            cursor: pointer;
        }
        .footer-tabs {
            padding: 6px 12px;
            background: rgba(0,0,0,0.4);
            border-top: 1px solid #232433;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
        }
        .tabs { display: flex; gap: 8px; }
        .tab { padding: 2px 6px; border-radius: 3px; color: #565f89; cursor: pointer; }
        .tab.active { background: #1a1b26; color: #7dcfff; border: 1px solid #232433; }
        .status { color: #34d67f; }
    </style>
</head>
<body>
    <div class="terminal">
        <div class="header">
            <div class="header-title">❯_ arch-chat — sway</div>
            <div id="clock">00:00</div>
        </div>

        <div class="sys-info">
            <div>ОС: <span>Android / Windows Mobile</span></div>
            <div>Сеть: <span style="color:#34d67f;">online</span></div>
            <div>Локаль: <span>ru-RU</span></div>
            <div class="color-boxes">
                <div class="box" style="background:#f7768e"></div>
                <div class="box" style="background:#7abc6d"></div>
                <div class="box" style="background:#e0af68"></div>
                <div class="box" style="background:#7dcfff"></div>
                <div class="box" style="background:#bb9af7"></div>
            </div>
            <div style="margin-top: 8px; color: #e0af68;">сессия открыта. напиши что-нибудь и жми Enter или SEND.</div>
        </div>

        <div class="chat-area" id="chatArea"></div>

        <div class="input-container">
            <div class="input-prefix">user@android👑 ~ %</div>
            <input type="text" id="userInput" placeholder="Ввод..." autocomplete="off">
            <button id="sendBtn">SEND</button>
        </div>

        <div class="footer-tabs">
            <div class="tabs">
                <div class="tab active">1:chat</div>
                <div class="tab" id="clearLogBtn">2:log (очистить)</div>
            </div>
            <div class="status">pollinations · online</div>
        </div>
    </div>
    <script>
        const chatArea = document.getElementById('chatArea');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const clockEl = document.getElementById('clock');
        const clearLogBtn = document.getElementById('clearLogBtn');

        const STORAGE_KEY = 'arch_chat_history_v3';

        function updateClock() {
            const now = new Date();
            clockEl.textContent = now.toTimeString().split(' ').substring(0, 5);
        }
        setInterval(updateClock, 1000);
        updateClock();

        function loadHistory() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    JSON.parse(saved).forEach(msg => appendToDOM(msg.text, msg.sender));
                } catch(e) {
                    localStorage.removeItem(STORAGE_KEY);
                }
            }
        }

        function saveMessage(text, sender) {
            let history = [];
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) history = JSON.parse(saved);
            history.push({ text, sender });
            localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
        }

        function appendToDOM(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('msg');
            if (sender === 'user') {
                msgDiv.classList.add('user-msg');
                msgDiv.innerHTML = `<div class="prompt-line">user@android👑 ~ %</div><div>${escapeHTML(text)}</div>`;
            } else if (sender === 'ai') {
                msgDiv.classList.add('ai-msg');
                msgDiv.innerHTML = `<div class="prompt-line">ai >></div><div>${text}</div>`;
            } else {
                msgDiv.classList.add('err-msg');
                msgDiv.innerHTML = `<div class="prompt-line">ошибка >></div><div>${escapeHTML(text)}</div>`;
            }
            chatArea.appendChild(msgDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }

        async function handleSend() {
            const text = userInput.value.trim();
            if (!text) return;

            appendToDOM(text, 'user');
            saveMessage(text, 'user');
            userInput.value = '';

            try {
                const response = await fetch(`https://pollinations.ai{encodeURIComponent(text)}?model=llama`);
                if (!response.ok) throw new Error(`сервер ответил ${response.status}`);
                
                const aiText = await response.text();
                appendToDOM(aiText, 'ai');
                saveMessage(aiText, 'ai');
            } catch (error) {
                appendToDOM(error.message, 'error');
            }
        }

        sendBtn.addEventListener('click', handleSend);
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                handleSend();
                userInput.blur();
            }
        });

        clearLogBtn.addEventListener('click', () => {
            if (confirm('Очистить историю?')) {
                localStorage.removeItem(STORAGE_KEY);
                chatArea.innerHTML = '';
            }
        });

        loadHistory();
    </script>
</body>
</html>
