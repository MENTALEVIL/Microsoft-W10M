<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>arch-chat</title>
    <style>
        :root {
            --bg: #0f0f13;
            --panel: #16161f;
            --border: #23232f;
            --text: #c0caf5;
            --text-muted: #565f89;
            --cyan: #7dcfff;
            --magenta: #bb9af7;
            --accent2: #34d67f;
            --warn: #e0af68;
            --err: #f7768e;
            --mono: "Terminus", "DejaVu Sans Mono", "Cascadia Code", monospace;
            --radius: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: var(--mono);
            font-size: 14px;
            line-height: 1.5;
            padding: 10px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: -webkit-fill-available;
        }

        .terminal {
            background-color: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            display: flex;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .header {
            background-color: rgba(0, 0, 0, 0.2);
            padding: 8px 12px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--text-muted);
        }

        .header-title {
            color: var(--cyan);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .sys-info {
            padding: 12px;
            border-bottom: 1px dashed var(--border);
            font-size: 13px;
            color: var(--text-muted);
        }

        .sys-info span {
            color: var(--text);
        }

        .chat-area {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .msg {
            word-break: break-word;
            white-space: pre-wrap;
        }

        .prompt-line {
            color: var(--magenta);
            font-weight: bold;
            margin-bottom: 4px;
        }

        .user-msg .prompt-line { color: var(--accent2); }
        .ai-msg .prompt-line { color: var(--cyan); }
        .err-msg { color: var(--err); }

        .input-form {
            display: flex;
            gap: 8px;
            align-items: center;
            padding: 12px;
            background-color: rgba(0, 0, 0, 0.1);
            border-top: 1px solid var(--border);
            margin: 0;
        }

        .input-prefix {
            color: var(--accent2);
            font-weight: bold;
            white-space: nowrap;
        }

        input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text);
            font-family: var(--mono);
            font-size: 14px;
            outline: none;
            padding: 4px 0;
        }

        button {
            background: var(--border);
            border: 1px solid var(--border);
            color: var(--cyan);
            padding: 6px 14px;
            font-family: var(--mono);
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
        }

        button:hover {
            background: var(--cyan);
            color: var(--bg);
        }

        .footer-tabs {
            padding: 6px 12px;
            background: rgba(0,0,0,0.3);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            font-size: 12px;
        }

        .tabs {
            display: flex;
            gap: 10px;
        }

        .tab {
            padding: 2px 8px;
            border-radius: 3px;
            color: var(--text-muted);
            cursor: pointer;
        }

        .tab.active {
            background: #1a1b26;
            color: var(--cyan);
            border: 1px solid var(--border);
        }

        .status {
            color: var(--accent2);
        }
    </style>
</head>
<body>
    <div class="terminal">
        <div class="header">
            <div class="header-title">❯_ arch-chat — sway</div>
            <div id="clock">00:00</div>
        </div>

        <div class="sys-info">
            <div>OS: <span>Windows Mobile (PWA Mode)</span></div>
            <div>Платформа: <span>Web-Environment</span></div>
            <div>Сеть: <span style="color: var(--accent2);">online</span></div>
            <div style="margin-top: 4px; color: var(--warn); font-size: 11px;">Клик по "2:log" очистит сохраненную историю.</div>
        </div>

        <div class="chat-area" id="chatArea"></div>

        <form class="input-form" id="chatForm" action="javascript:void(0);">
            <div class="input-prefix">user@device ~ %</div>
            <input type="text" id="userInput" placeholder="Напишите..." autocomplete="off" enterkeyhint="send">
            <button type="submit" id="sendBtn">SEND</button>
        </form>

        <div class="footer-tabs">
            <div class="tabs">
                <div class="tab active">1:chat</div>
                <div class="tab" id="clearLogBtn">2:log</div>
            </div>
            <div class="status">pollinations · online</div>
        </div>
    </div>

    <script>
        const chatArea = document.getElementById('chatArea');
        const userInput = document.getElementById('userInput');
        const chatForm = document.getElementById('chatForm');
        const clockEl = document.getElementById('clock');
        const clearLogBtn = document.getElementById('clearLogBtn');

        const STORAGE_KEY = 'arch_chat_history';

        function updateClock() {
            const now = new Date();
            clockEl.textContent = now.toTimeString().split(' ').substring(0, 5);
        }
        setInterval(updateClock, 1000);
        updateClock();

        function loadHistory() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    const history = JSON.parse(saved);
                    history.forEach(msg => appendToDOM(msg.text, msg.sender, true));
                } catch(e) {
                    localStorage.removeItem(STORAGE_KEY);
                }
            } else {
                appendToDOM("сессия открыта. напиши что-нибудь.", 'ai', true);
            }
            scrollToBottom();
        }

        function saveMessage(text, sender) {
            const saved = localStorage.getItem(STORAGE_KEY);
            let history = saved ? JSON.parse(saved) : [];
            history.push({ text, sender });
            localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
        }

        function appendToDOM(text, sender, isHistoryLoading = false) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('msg');
            
            if (sender === 'user') {
                msgDiv.classList.add('user-msg');
                msgDiv.innerHTML = `<div class="prompt-line">user@device ~ %</div><div>${escapeHTML(text)}</div>`;
            } else if (sender === 'ai') {
                msgDiv.classList.add('ai-msg');
                msgDiv.innerHTML = `<div class="prompt-line">ai >></div><div>${text}</div>`;
            } else {
                msgDiv.classList.add('err-msg');
                msgDiv.innerHTML = `<div class="prompt-line" style="color:var(--err)">ошибка >></div><div>${escapeHTML(text)}</div>`;
            }
            
            chatArea.appendChild(msgDiv);
            if (!isHistoryLoading) {
                scrollToBottom();
            }
        }

        function scrollToBottom() {
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }

        async function handleFormSubmit(e) {
            if(e) e.preventDefault();
            
            const text = userInput.value.trim();
            if (!text) return;

            appendToDOM(text, 'user');
            saveMessage(text, 'user');
            userInput.value = '';
            
            userInput.blur(); 

            try {
                const response = await fetch(`https://pollinations.ai{encodeURIComponent(text)}?model=llama`);
                
                if (!response.ok) {
                    throw new Error(`сервер ответил ${response.status}`);
                }

                const aiText = await response.text();
                appendToDOM(aiText, 'ai');
                saveMessage(aiText, 'ai');

            } catch (error) {
                appendToDOM(error.message, 'error');
            }
        }

        clearLogBtn.addEventListener('click', () => {
            if (confirm('Очистить всю историю переписки?')) {
                localStorage.removeItem(STORAGE_KEY);
                chatArea.innerHTML = '';
                appendToDOM("история очищена. сессия перезапущена.", 'ai');
            }
        });

        chatForm.addEventListener('submit', handleFormSubmit);
        loadHistory();
    </script>
</body>
</html>
